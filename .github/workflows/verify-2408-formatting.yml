name: Verify GH-2408 formatting

on:
  push:
    branches:
      - verify/2408-formatting

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare standalone formatter configuration
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.sax.saxutils import escape
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          temporary = Path(os.environ["RUNNER_TEMP"]) / "format-check"
          temporary.mkdir(exist_ok=True)
          config = workspace / ".github/verification/spring-data-eclipse-formatting.xml"
          pom = f"""<project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>verification</groupId><artifactId>gh-2408-format</artifactId><version>1</version>
            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <build><plugins><plugin>
              <groupId>net.revelc.code.formatter</groupId>
              <artifactId>formatter-maven-plugin</artifactId>
              <version>2.29.0</version>
              <configuration>
                <configFile>{escape(str(config))}</configFile>
                <sourceDirectory>{escape(str(workspace))}</sourceDirectory>
                <testSourceDirectory>{escape(str(temporary / "unused"))}</testSourceDirectory>
                <lineEnding>LF</lineEnding>
                <includes>
                  <include>spring-data-jdbc/src/main/java/org/springframework/data/jdbc/repository/support/FetchableFluentQueryByExample.java</include>
                  <include>spring-data-jdbc/src/test/java/org/springframework/data/jdbc/repository/JdbcRepositoryIntegrationTests.java</include>
                </includes>
              </configuration>
            </plugin></plugins></build>
          </project>"""
          (temporary / "pom.xml").write_text(pom, encoding="utf-8")
          PY
      - name: Apply Eclipse formatter with Spring Data settings
        working-directory: ${{ runner.temp }}
        shell: bash
        run: mvn --batch-mode --no-transfer-progress -f "$RUNNER_TEMP/format-check/pom.xml" formatter:format
      - name: Check that both changed files are already formatted
        shell: bash
        run: |
          git diff --exit-code -- \
            spring-data-jdbc/src/main/java/org/springframework/data/jdbc/repository/support/FetchableFluentQueryByExample.java \
            spring-data-jdbc/src/test/java/org/springframework/data/jdbc/repository/JdbcRepositoryIntegrationTests.java
